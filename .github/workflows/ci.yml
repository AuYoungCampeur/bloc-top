name: Product checks

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

concurrency:
  group: product-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint both applications
        run: pnpm lint
      - name: Generate routes and check types
        run: pnpm typecheck
      - name: Run isolated business and component tests
        run: pnpm test:run
      - name: Install component-test browser
        run: pnpm --filter @bloctop/pwa exec playwright install --with-deps chromium
      - name: Run browser component tests
        run: pnpm test:ct
      - name: Build both applications without service credentials
        run: pnpm build
      - name: Verify offline cold start with local fixtures
        shell: bash
        run: |
          cd apps/pwa
          node node_modules/next/dist/bin/next start -p 4100 > "$RUNNER_TEMP/offline-pwa.log" 2>&1 &
          PWA_SERVER_PID=$!
          trap 'kill "$PWA_SERVER_PID" 2>/dev/null || true; wait "$PWA_SERVER_PID" 2>/dev/null || true' EXIT
          PWA_READY=false
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 2 http://localhost:4100/zh/offline > /dev/null; then
              PWA_READY=true
              break
            fi
            sleep 1
          done
          if [ "$PWA_READY" != true ]; then
            cat "$RUNNER_TEMP/offline-pwa.log"
            exit 1
          fi
          node scripts/offline-sw-smoke.mjs

  required-checks:
    # Keep the existing protected-branch check names. Each requires the complete
    # Node 22/24 matrix, including builds, rather than weakening the release gate.
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      matrix:
        check: ['🔍 ESLint', '📘 TypeScript', '🧪 Unit Tests', '🎭 Playwright']
    name: ${{ matrix.check }}
    steps:
      - name: Require successful verification on both Node versions
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = success
